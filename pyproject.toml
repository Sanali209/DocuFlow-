[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docuflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dishka>=1.9.1",
    "fastapi>=0.135.2",
    "loguru>=0.7.3",
    "nicegui>=3.9.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.13.1",
    "pytest-cov>=7.1.0",
    "rich>=14.3.3",
    "sqlmodel>=0.0.37",
    "uvicorn[standard]>=0.42.0",
    "watchdog>=6.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
]

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-playwright>=0.7.0",
    "ruff>=0.15.8",
    "pre-commit>=4.0.0",
    "pyright>=1.1.409",
    "import-linter>=2.2",
    "vulture>=2.14",
    "radon>=6.0",
    "xenon>=0.9",
    "types-passlib>=1.7.7.20260211",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "S", "UP", "RUF", "TID",
    "ASYNC", "C4", "SIM", "PERF",
]
ignore = [
    "S101", "S106",
    "RUF001", "RUF002", "RUF003",
    "ASYNC240", "ASYNC230",  # Sync file I/O is intentional in background loops
    "SIM105",  # try/except/pass is used intentionally (reservation fallback, etc.)
]
exclude = ["._archive/**"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/docuflow/features/**/view.py" = ["SIM117"]
"src/docuflow/lib/widgets/*.py" = ["SIM117"]
"src/docuflow/features/core/layout.py" = ["SIM117"]
"src/docuflow/features/chat/incident_view.py" = ["SIM117"]
"src/docuflow/features/folder_scanner/mirror.py" = ["ASYNC109"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
ignoreMissingImports = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["no-any-return"]
exclude = [
    "._archive/",
    ".*_archive/",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.vulture]
min_confidence = 80
paths = ["src"]
exclude = ["tests/", "docs/", "scripts/"]
ignore_decorators = ["@ui.page", "@ui.refreshable", "@ui.refreshable_method", "@register_view"]
ignore_names = ["register_*_view", "on_startup", "on_shutdown"]
