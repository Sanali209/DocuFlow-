[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docuflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dishka>=1.9.1",
    "fastapi>=0.135.2",
    "loguru>=0.7.3",
    "nicegui>=3.9.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.13.1",
    "pytest-cov>=7.1.0",
    "rich>=14.3.3",
    "sqlmodel>=0.0.37",
    "uvicorn[standard]>=0.42.0",
    "watchdog>=6.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
]

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "mypy>=1.20.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-playwright>=0.7.0",
    "ruff>=0.15.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "S", "UP", "RUF", "TID",
]
ignore = ["S101", "S106"]  # Ignore assert and hardcoded secrets for now

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nicegui.*", "sqlmodel.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
